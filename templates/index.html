<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz do Pai do Ano 👑</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(25, 118, 210, 0.15),
                        0 5px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.8);
            position: relative;
            z-index: 10;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 33%;
            background: linear-gradient(90deg, #2196f3, #1e88e5);
            transition: width 0.4s ease;
        }

        .question-title {
            color: #1565c0;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-option {
            background: #ffffff;
            border: 2px solid #90caf9;
            color: #1976d2;
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .btn-option:hover {
            background: #2196f3;
            color: white;
            border-color: #2196f3;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(33, 150, 243, 0.3);
        }

        /* Certificado Final */
        .certificate-card {
            display: none;
            background: #fffdf5;
            border: 4px double #d4af37;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
        }

        .certificate-card::before {
            content: "🏆";
            font-size: 3rem;
            display: block;
            margin-bottom: 10px;
        }

        .cert-title {
            color: #b8860b;
            font-size: 1.6rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .cert-name {
            color: #1565c0;
            font-size: 2rem;
            font-weight: 800;
            margin: 15px 0;
            border-bottom: 2px solid #d4af37;
            display: inline-block;
            padding-bottom: 5px;
        }

        .cert-msg {
            color: #424242;
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.4;
            margin-top: 15px;
        }

        /* Partículas de Confetes */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 150;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-5vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="quizContainer">
        <div class="progress-bar">
            <div class="progress" id="progressBar"></div>
        </div>

        <h2 class="question-title" id="questionTitle">Carregando pergunta...</h2>

        <div class="options-grid" id="optionsGrid"></div>
    </div>

    <div class="container certificate-card" id="certificateContainer">
        <div class="cert-title">Certificado Oficial</div>
        <div>Concedido a:</div>
        <div class="cert-name">André</div>
        <div class="cert-msg">eleito o melhor pai do ano pelo vigesimo segundo ano consecutivo!! 🎉🏆✨</div>
    </div>

    <script>
        const questions = [
            {
                title: "quem é o fiscal oficial de sapatos no corredor?",
                options: ["André (com certeza)", "O pai", "Você mesmo", "Todas as alternativas acima"]
            },
            {
                title: "quem é o maior apoiador de vilanias?",
                options: ["O melhor pai do mundo", "André", "O mestre dos planos", "Com certeza o André"]
            },
            {
                title: "quem é o maior hater do matty healy?",
                options: ["André", "O próprio André", "Definitivamente o André", "Pai do ano & Hater nº 1 do Matty Healy"]
            }
        ];

        let currentQuestion = 0;

        function renderQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('questionTitle').innerText = q.title;
            
            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';

            // Atualiza a barra de progresso
            const progressPercent = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressBar').style.width = `${progressPercent}%`;

            q.options.forEach(optionText => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = optionText;
                btn.onclick = nextQuestion;
                grid.appendChild(btn);
            });
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                renderQuestion();
            } else {
                showCertificate();
            }
        }

        function showCertificate() {
            document.getElementById('quizContainer').style.display = 'none';
            const cert = document.getElementById('certificateContainer');
            cert.style.display = 'block';

            // Efeito de Chuva de Confetes
            const confetti = ['🎉', '🏆', '⭐', '✨', '👑', '🥇', '💙'];
            for (let i = 0; i < 80; i++) {
                setTimeout(() => {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    p.innerText = confetti[Math.floor(Math.random() * confetti.length)];
                    p.style.left = Math.random() * 100 + 'vw';
                    p.style.fontSize = (Math.random() * 20 + 20) + 'px';
                    p.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(p);

                    setTimeout(() => p.remove(), 4000);
                }, i * 30);
            }
        }

        // Inicia o Quiz
        renderQuestion();
    </script>
</body>
</html>

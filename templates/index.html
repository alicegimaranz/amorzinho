<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabéns pelo primeiro ano de MP!</title>
    <style>
        body {
            background-color: #ffe6f0;
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding-top: 50px;
            color: #d63384;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        /* Estilização do Bolinho e da Vela */
        .cake-container {
            position: relative;
            display: inline-block;
            margin-top: 40px;
        }
        .candle {
            width: 12px;
            height: 50px;
            background-color: #ffc107;
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 4px;
        }
        .flame {
            width: 20px;
            height: 30px;
            background: orange;
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            animation: flicker 0.6s infinite alternate;
        }
        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1); opacity: 0.9; }
            100% { transform: translateX(-50%) scale(1.1); opacity: 1; background: gold; }
        }
        .frosting {
            width: 220px;
            height: 60px;
            background-color: #ff99bb;
            border-radius: 110px 110px 20px 20px;
            margin: 0 auto;
        }
        .cake-body {
            width: 200px;
            height: 120px;
            background-color: #8B4513;
            border-radius: 0 0 20px 20px;
            margin: 0 auto;
        }
        .plate {
            width: 280px;
            height: 20px;
            background-color: #fff;
            border-radius: 10px;
            margin: 0 auto;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>Parabéns pelo primeiro ano de MP! 💖</h1>


    <div class="cake-container">
        <div class="candle">
            <div class="flame"></div>
        </div>
        <div class="frosting"></div>
        <div class="cake-body"></div>
        <div class="plate"></div>
    </div>

</body>
</html>
